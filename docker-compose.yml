version: '3.8'

services:
  db:
    image: postgres:15
    container_name: db_fisiologica
    environment:
      POSTGRES_USER: admin_fisiologia
      POSTGRES_PASSWORD: super_password_seguro
      POSTGRES_DB: fisiologia_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: